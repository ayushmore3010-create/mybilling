{% extends "base.html" %}

{% block title %}Register - MyBillingSystem{% endblock %}

{% block content %}
<section class="py-16 bg-slate-50 min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-brand-600 text-white flex items-center justify-center font-bold text-2xl mx-auto shadow-md shadow-brand-500/30">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 14l2 2 4-4m5-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Free Account</h2>
                <p class="text-slate-500 text-sm">Start managing your shop bills in 2 minutes</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" name="full_name" required placeholder="e.g. Rahul Patil" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="rahul@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mobile Number</label>
                    <input type="tel" name="mobile" required placeholder="9876543210" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-medium">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-sm bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-500/30 transition-all">
                    Register & Continue &rarr;
                </button>
            </form>

            <div class="text-center pt-4 border-t text-xs text-slate-500">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-brand-600 font-bold hover:underline">Login here</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
