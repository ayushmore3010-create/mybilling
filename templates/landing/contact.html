{% extends "base.html" %}

{% block title %}Contact Us - MyBillingSystem{% endblock %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-xl mx-auto px-4">
        <div class="bg-slate-50 p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-slate-900">Get in Touch</h1>
                <p class="text-slate-500 text-sm">Have questions or need assistance? Send us a message.</p>
            </div>

            <form action="{{ url_for('public.contact') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Your Name</label>
                    <input type="text" name="name" required placeholder="e.g. Rahul Patil" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="rahul@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mobile Number</label>
                    <input type="tel" name="mobile" placeholder="9876543210" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Subject</label>
                    <input type="text" name="subject" placeholder="Sales query / Product support" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Message</label>
                    <textarea name="message" required rows="4" placeholder="How can we help your shop?" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm font-medium"></textarea>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-sm bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-500/20 transition">
                    Send Message &rarr;
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
