{% extends "base.html" %}

{% block title %}Forgot Password - MyBillingSystem{% endblock %}

{% block content %}
<section class="py-16 bg-slate-50 min-h-[70vh] flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Reset Password</h2>
                <p class="text-slate-500 text-sm">Enter your registered email address to receive password reset instructions.</p>
            </div>

            <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="rahul@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-sm bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-500/30 transition-all">
                    Send Reset Link &rarr;
                </button>
            </form>

            <div class="text-center pt-4 border-t text-xs text-slate-500">
                Remembered your password? <a href="{{ url_for('auth.login') }}" class="text-brand-600 font-bold hover:underline">Back to login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
